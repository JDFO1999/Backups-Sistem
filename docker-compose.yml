version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: db_backup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d "]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backup-network

  redis:
    image: redis:7-alpine
    container_name: db_backup_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backup-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db_backup_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://:@postgres:5432/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backup_staging:/tmp/backup_staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backup-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db_backup_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://:@postgres:5432/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - backup_staging:/tmp/backup_staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backup-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db_backup_scheduler
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://:@postgres:5432/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backup-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: db_backup_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - backup-network

networks:
  backup-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backup_staging:
